server:
  port: ${PORT:9991}

spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          uri: ${CONFIG_REPO_URI}
          username: ${USERNAME}
          password: ${PASSWORD}
          default-label: main
          search-paths: "{application}"
          clone-on-start: true

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info,metrics