services:
  company-db:
    image: postgres:17
    container_name: company-db
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_company-db-data:/var/lib/postgresql/data

volumes:
  postgres_company-db-data: