services:
  application-db:
    image: postgres:17
    container_name: application-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_application-db-data:/var/lib/postgresql/data

volumes:
  postgres_application-db-data: